execution = "remote"

branch_prefix = "chatgpt-worker/"
max_iterations = 5

[browser]
transport = "cdp" # manual | native | cdp
auto_allow = false # if true, lifecycle starts auto_allow.sh before each automated send
# uivision_autorun_html = "/Users/you/uivision/ui.vision.html" # required/auto-detected for native
# uivision_macro_name = "ChatGPTClickSendExistingTab"

[remote]
host = "ai-server"
repo_roots = [
  "/mnt/omv/git",
  "/home/broliang/git",
]

[[remote.path_mappings]]
remote = "/mnt/omv"
local = "/Volumes/omv"

[validation]
commands = [
  "pytest -q",
  "ruff check .",
]
[communication]
runtime_dir = ".chatgpt-worker"
retain_on_merge = false

