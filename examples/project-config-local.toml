execution = "local"

branch_prefix = "chatgpt-worker/"
max_iterations = 5

[browser]
transport = "cdp" # manual | native | cdp
# uivision_autorun_html = "/Users/you/uivision/ui.vision.html" # required/auto-detected for native
# uivision_macro_name = "ChatGPTClickSendExistingTab"

[validation]
commands = [
  "npm run typecheck",
  "npm test",
  "npm run build",
]
[communication]
runtime_dir = ".chatgpt-worker"
retain_on_merge = false

